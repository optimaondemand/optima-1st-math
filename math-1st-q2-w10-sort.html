<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subtraction Sort: 8, 9, 10 (to 20)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf4fb;--ink:#12263a;--card:#fff;--line:#b9d3e6;--c5:#1b998b;--c6:#e59a00;--c7:#7b4fd0;--soft5:#d9f3ef;--soft6:#fdf0cf;--soft7:#e9e0fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c2a;--ink:#eaf2f8;--card:#1a2c3f;--line:#35506a;--soft5:#12403c;--soft6:#463510;--soft7:#2e2250}}
:root[data-theme="dark"]{--bg:#0f1c2a;--ink:#eaf2f8;--card:#1a2c3f;--line:#35506a;--soft5:#12403c;--soft6:#463510;--soft7:#2e2250}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.7rem;margin:0 0 4px;font-weight:600}
.sub{margin:0 0 16px;opacity:.8}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.count{font-weight:500}
button{font:inherit;cursor:pointer}
.reset{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:6px 14px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px;padding:12px;border:2px dashed var(--line);border-radius:16px;margin-bottom:16px}
.fact{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-size:1.5rem;font-weight:600;min-width:104px;text-align:center;touch-action:none;user-select:none}
.fact.sel{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 4px 0 var(--ink)}
.fact.dragging{opacity:.4}
.fact.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bucket{border:3px solid;border-radius:18px;padding:10px 8px;min-height:230px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card)}
.bucket[data-n="8"]{border-color:var(--c5);background:var(--soft5)}
.bucket[data-n="9"]{border-color:var(--c6);background:var(--soft6)}
.bucket[data-n="10"]{border-color:var(--c7);background:var(--soft7)}
.bucket.over{outline:4px solid var(--ink)}
.bucket h2{margin:0;font-size:1.05rem;font-weight:500}
.bucket .big{font-size:2.6rem;font-weight:600;line-height:1}
.bucket[data-n="8"] .big{color:var(--c5)}
.bucket[data-n="9"] .big{color:var(--c6)}
.bucket[data-n="10"] .big{color:var(--c7)}
.placed{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.placed span{background:var(--card);border-radius:10px;padding:3px 10px;font-weight:500;width:100%;max-width:130px;text-align:center}
#msg{min-height:1.6em;text-align:center;margin:14px 0 0;font-weight:500}
.win{text-align:center;font-size:1.3rem;font-weight:600;padding:18px;border-radius:16px;background:var(--card);border:3px solid var(--c5);margin-top:14px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:520px){.fact{font-size:1.25rem;min-width:88px}.bucket .big{font-size:2.2rem}}
@media (prefers-reduced-motion:reduce){.fact.shake{animation:none}}
</style>
</head>
<body>
<main>
<h1>Subtraction sort</h1>
<p class="sub">Solve each fact. Drag it to the matching answer, or tap the fact and then tap the answer.</p>
<div class="bar"><span class="count" id="count"></span><button class="reset" id="reset">New facts</button></div>
<div class="pool" id="pool" aria-label="Facts to sort"></div>
<div class="buckets" id="buckets"></div>
<p id="msg" role="status" aria-live="polite"></p>
<div id="done"></div>
</main>
<script>
let FACTS=[];
const POOL={8:[],9:[],10:[]};
for(const d of [8,9,10]) for(let w=Math.max(d+1,11);w<=20;w++) POOL[d].push({w,s:w-d,d});
let remaining,selected=null,dragged=null;
const pool=document.getElementById('pool'),bk=document.getElementById('buckets'),msg=document.getElementById('msg');

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function build(){
  selected=null;FACTS=[8,9,10].flatMap(d=>shuffle(POOL[d]).slice(0,5).map(f=>({...f})));remaining=shuffle(FACTS);
  document.getElementById('done').innerHTML='';msg.textContent='';
  bk.innerHTML='';
  for(const n of [8,9,10]){
    const b=document.createElement('div');b.className='bucket';b.dataset.n=n;
    b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-label','Answer '+n);
    b.innerHTML='<div class="big">'+n+'</div><h2>Answer is '+n+'</h2><div class="placed"></div>';
    b.addEventListener('click',()=>drop(n));
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drop(n)}});
    b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('over')});
    b.addEventListener('dragleave',()=>b.classList.remove('over'));
    b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('over');if(dragged){selected=dragged;drop(n)}});
    bk.appendChild(b);
  }
  render();
}

function render(){
  pool.innerHTML='';
  for(const f of remaining){
    const el=document.createElement('button');el.className='fact'+(selected===f?' sel':'');
    el.textContent=f.w+' − '+f.s;el.draggable=true;
    el.setAttribute('aria-label',f.w+' minus '+f.s);
    el.addEventListener('click',()=>{selected=selected===f?null:f;msg.textContent=selected?'Now tap the answer for '+f.w+' − '+f.s+'.':'';render()});
    el.addEventListener('dragstart',e=>{dragged=f;el.classList.add('dragging');e.dataTransfer.setData('text/plain','f')});
    el.addEventListener('dragend',()=>{dragged=null;el.classList.remove('dragging')});
    f.el=el;pool.appendChild(el);
  }
  document.getElementById('count').textContent=(FACTS.length-remaining.length)+' of '+FACTS.length+' sorted';
}

function drop(n){
  if(!selected){msg.textContent='Pick a fact first.';return}
  const f=selected;
  if(f.d===n){
    const sp=document.createElement('span');sp.textContent=f.w+' − '+f.s+' = '+n;
    bk.querySelector('[data-n="'+n+'"] .placed').appendChild(sp);
    remaining=remaining.filter(x=>x!==f);selected=null;
    msg.textContent='Yes! '+f.w+' − '+f.s+' = '+n+'.';
    render();
    if(!remaining.length)document.getElementById('done').innerHTML='<div class="win">All '+FACTS.length+' facts sorted. Great subtracting!</div>';
  }else{
    msg.textContent='Not quite. Count back '+f.s+' from '+f.w+' and try again.';
    const el=f.el;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
  }
}
document.getElementById('reset').addEventListener('click',build);
build();
</script>
</body>
</html>
