<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordinal Numbers Line Up</title>
<style>
  :root{
    --cream:#F2F8FF; --ink:#23283A; --card:#FFFFFF;
    --blue:#2B7BC4; --purple:#7A4BC9; --green:#3C9A3C; --bad:#E05252; --gold:#F2B52C;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:'Trebuchet MS','Segoe UI',sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden;}
  .wrap{max-width:960px;margin:0 auto;padding:18px 16px 32px;}
  header{text-align:center;margin-bottom:8px;}
  h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:4px 0 2px;color:var(--purple);}
  p.sub{margin:0;font-size:1.05rem;color:#4d5368;}
  .scoreboard{display:flex;justify-content:center;gap:14px;margin:10px 0 14px;font-weight:bold;flex-wrap:wrap;}
  .scoreboard span{background:var(--card);border-radius:999px;padding:6px 16px;box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .prompt{
    background:var(--card);border-radius:22px;padding:18px 16px;text-align:center;font-size:clamp(1.3rem,4.5vw,1.9rem);
    font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.08);margin:6px auto 18px;max-width:720px;
  }
  .prompt .ord{color:var(--purple);}
  .lane{
    display:flex;align-items:flex-end;justify-content:center;gap:8px;flex-wrap:nowrap;
    padding:14px 8px 10px;background:linear-gradient(180deg,#DDEEFF,#C6E3FF);border-radius:24px;
    overflow-x:auto;
  }
  .start{display:flex;flex-direction:column;align-items:center;font-size:.85rem;font-weight:bold;color:var(--blue);min-width:52px;}
  .start .flag{font-size:2.2rem;}
  .animal{
    flex:0 0 auto;width:78px;height:92px;border-radius:18px;background:var(--card);border:3px solid #cfe0f2;
    font-size:2.6rem;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 3px 0 #cfe0f2;transition:transform .15s,border-color .15s;-webkit-tap-highlight-color:transparent;
    font-family:inherit;
  }
  .animal:hover{transform:translateY(-3px);}
  .animal.static{cursor:default;}
  .animal.static:hover{transform:none;}
  .animal.target{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,181,44,.35),0 3px 0 var(--gold);animation:bob 1s ease-in-out infinite;}
  .animal.correct{border-color:var(--green);background:#E5F7E5;}
  .animal.wrong{animation:shake .4s;border-color:var(--bad);}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .arrow{text-align:center;color:var(--blue);font-weight:bold;margin:6px 0 0;font-size:.95rem;}
  .choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px;min-height:64px;}
  .choice{
    min-width:120px;padding:12px 16px;border:none;border-radius:18px;background:linear-gradient(160deg,#9B6BE8,var(--purple));color:#fff;
    font-size:1.3rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);font-family:inherit;
  }
  .choice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
  .choice.wrong{animation:shake .4s;background:var(--bad);}
  .choice.correct{background:var(--green);}
  .choice small{display:block;font-size:.8rem;opacity:.9;font-weight:normal;}
  .hint{text-align:center;min-height:1.6em;margin:14px 0 0;font-size:1.1rem;font-weight:bold;color:#4d5368;}
  .summary{display:none;text-align:center;background:var(--card);border-radius:24px;padding:26px 16px;max-width:520px;margin:20px auto;box-shadow:0 4px 0 rgba(0,0,0,.08);}
  .summary h2{margin:0 0 8px;font-size:1.8rem;color:var(--purple);}
  .summary .big{font-size:3rem;}
  .controls{text-align:center;margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  button.btn{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:1rem;cursor:pointer;font-family:inherit;}
  button.btn.alt{background:var(--purple);}
  @media (max-width:560px){ .animal{width:56px;height:70px;font-size:2rem;} .start{min-width:40px;} .lane{gap:5px;} }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--cream:#171B28;--ink:#F1F3FA;--card:#232A3D;}
    .lane{background:linear-gradient(180deg,#26385A,#1E2D4A);}
    .animal{border-color:#3a4a6a;box-shadow:0 3px 0 #3a4a6a;}
    .animal.correct{background:#1F3B26;}
    p.sub,.hint{color:#b8c0d8;}
    h1,.summary h2,.prompt .ord{color:#B79CF5;}
    .start,.arrow{color:#7DB8F5;}
    button.btn{background:#3a4560;}
  }
  :root[data-theme="dark"]{--cream:#171B28;--ink:#F1F3FA;--card:#232A3D;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏁 Line Up with Ordinal Numbers</h1>
    <p class="sub">The line starts at the flag. Count from the flag!</p>
  </header>
  <div class="scoreboard">
    <span id="roundEl">Question 1 of 10</span>
    <span id="scoreEl">⭐ Score: 0</span>
  </div>

  <div id="game">
    <div class="prompt" id="prompt"></div>
    <div class="lane" id="lane"></div>
    <div class="arrow">The line goes this way ➡️</div>
    <div class="choices" id="choices"></div>
    <div class="hint" id="hint">&nbsp;</div>
  </div>

  <div class="summary" id="summary">
    <div class="big">🎉</div>
    <h2>Great job!</h2>
    <p id="summaryText"></p>
  </div>

  <div class="controls">
    <button class="btn alt" id="soundBtn">🔊 Sound: On</button>
    <button class="btn" id="resetBtn">🔄 Play Again</button>
  </div>
</div>

<script>
const ORD = ["first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth"];
const SHORT = ["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th"];
const ANIMALS = [
  {e:"🐶",n:"dog"},{e:"🐱",n:"cat"},{e:"🐰",n:"rabbit"},{e:"🐸",n:"frog"},{e:"🐻",n:"bear"},
  {e:"🦊",n:"fox"},{e:"🐼",n:"panda"},{e:"🐵",n:"monkey"},{e:"🐷",n:"pig"},{e:"🐮",n:"cow"},
  {e:"🦁",n:"lion"},{e:"🐯",n:"tiger"}
];
const TOTAL = 10;
let round=0, score=0, soundOn=true, line=[], target=0, type='A', missed=false, locked=false;

const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function speak(t){
  if(!soundOn) return;
  try{ if('speechSynthesis' in window){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=0.85; speechSynthesis.speak(u);} }catch(e){}
}

function startRound(){
  locked=false; missed=false;
  $('hint').innerHTML='&nbsp;';
  $('roundEl').textContent=`Question ${round+1} of ${TOTAL}`;
  const len = round<5 ? 5 : round<8 ? 6 : 8;
  line = shuffle(ANIMALS).slice(0,len);
  type = round%2===0 ? 'A' : 'B';
  target = Math.floor(Math.random()*len);
  const lane=$('lane'); lane.innerHTML='';
  const st=document.createElement('div'); st.className='start'; st.innerHTML='<div class="flag">🚩</div>START'; lane.appendChild(st);
  line.forEach((a,i)=>{
    const b=document.createElement('button');
    b.className='animal'+(type==='B'?' static':'')+(type==='B'&&i===target?' target':'');
    b.textContent=a.e; b.setAttribute('aria-label',a.n);
    if(type==='A') b.addEventListener('click',()=>pickAnimal(i,b));
    lane.appendChild(b);
  });
  const ch=$('choices'); ch.innerHTML='';
  let text;
  if(type==='A'){
    text=`Tap the ${ORD[target]} animal.`;
    $('prompt').innerHTML=`Tap the <span class="ord">${ORD[target]}</span> animal.`;
  } else {
    text=`Where is the ${line[target].n}? What position is it in?`;
    $('prompt').innerHTML=`Where is the ${line[target].e}? Which position is it in?`;
    let opts=new Set([target]);
    while(opts.size<4){ opts.add(Math.floor(Math.random()*len)); }
    shuffle([...opts]).forEach(i=>{
      const c=document.createElement('button'); c.className='choice';
      c.innerHTML=`${ORD[i]}<small>${SHORT[i]}</small>`;
      c.addEventListener('click',()=>pickChoice(i,c));
      ch.appendChild(c);
    });
  }
  speak(text);
}

function good(){
  locked=true;
  if(!missed) score++;
  $('scoreEl').textContent=`⭐ Score: ${score}`;
  $('hint').textContent='Yes! Great counting! 🎉';
  speak('Yes! Great counting!');
  setTimeout(()=>{ round++; round>=TOTAL?finish():startRound(); },1300);
}
function bad(el,msg){
  missed=true;
  el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),400);
  $('hint').textContent=msg;
}
function pickAnimal(i,el){
  if(locked) return;
  if(i===target){ el.classList.add('correct'); good(); }
  else bad(el,'Not quite. Start at the flag and count each animal.');
}
function pickChoice(i,el){
  if(locked) return;
  if(i===target){ el.classList.add('correct'); good(); }
  else bad(el,'Not quite. Start at the flag and count to the animal.');
}
function finish(){
  $('game').style.display='none';
  $('summary').style.display='block';
  $('summaryText').textContent=`You got ${score} out of ${TOTAL} on the first try!`;
  speak(`Great job! You got ${score} out of ${TOTAL} on the first try!`);
}
$('soundBtn').addEventListener('click',e=>{
  soundOn=!soundOn; e.currentTarget.textContent=soundOn?'🔊 Sound: On':'🔇 Sound: Off';
});
$('resetBtn').addEventListener('click',()=>{
  round=0; score=0; $('scoreEl').textContent='⭐ Score: 0';
  $('summary').style.display='none'; $('game').style.display='block';
  startRound();
});
startRound();
</script>
</body>
</html>

</body></html>
